[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aesthetic-model-training"
version = "1.0.0"
description = "Edit-chain dataset builder, feature extraction, and baseline model training for intent-aware degradation scoring."
requires-python = "==3.11.*"
dependencies = [
    "numpy>=1.26.0",
    "Pillow>=10.2.0",
    "scikit-image>=0.22.0",
    "scipy>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[tool.setuptools.packages.find]
include = ["aesthetic_scoring*"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "gpu: marks tests requiring GPU",
]
